[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot_llm"
version = "0.1.0"
description = "LLM gateway: local Ollama + Groq/Cerebras/OpenRouter boost with fallback, cache, quota (docs/03_LLM_GATEWAY.md)"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "httpx>=0.27", "pydantic>=2.6", "copilot_common"]

[tool.setuptools.packages.find]
include = ["copilot_llm*"]
