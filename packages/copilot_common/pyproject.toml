[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot_common"
version = "0.1.0"
description = "Shared contracts for the Copilot Indian-market intelligence terminal (docs/01_CONTRACTS.md)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "fastapi>=0.110", "httpx>=0.27", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["copilot_common*"]

[tool.setuptools.package-data]
copilot_common = ["fixtures/**/*.json"]
