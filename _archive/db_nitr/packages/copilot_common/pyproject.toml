[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "copilot_common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["."]
