# Weaviate on L2 (02 §5).  docker compose -f infra/docker-compose.yml up -d
# check:  curl http://localhost:8080/v1/.well-known/ready
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.8   # latest stable on 2026-10-01; re-check on day 0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: unless-stopped
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"     # we bring our own bge-small vectors
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  weaviate_data:
